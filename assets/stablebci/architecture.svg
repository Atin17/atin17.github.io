<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 650" role="img" aria-labelledby="title desc"><title id="title">C++ and Python streaming architecture</title><desc id="desc">Separate control inference and asynchronous adaptation. Bounded transport, guarded coherent snapshots, version checks and rollback. Adaptation availability remains under investigation.</desc><rect width="1120" height="650" rx="16" fill="#10161e"/><g font-family="Inter,system-ui,sans-serif"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#79b5dd"/></marker></defs><text x="54" y="48" fill="#79b5dd" font-size="21" >C++ CONTROL PATH</text><text x="650" y="48" fill="#e3b879" font-size="21" >ASYNCHRONOUS PYTHON WORKER</text><rect x="40" y="82" width="460" height="85" rx="10" fill="#151b23" stroke="#79b5dd" stroke-opacity=".6" stroke-width="2"/><text x="60" y="116" fill="#f0f3f6" font-size="22" >10-ms feature ingestion</text><text x="60" y="143" fill="#aebbc9" font-size="16" >192 channels; data-integrity checks</text><rect x="40" y="194" width="460" height="85" rx="10" fill="#151b23" stroke="#79b5dd" stroke-opacity=".6" stroke-width="2"/><text x="60" y="228" fill="#f0f3f6" font-size="22" >Circular history buffer</text><text x="60" y="255" fill="#aebbc9" font-size="16" >300 ms; incremental aggregation</text><rect x="40" y="306" width="460" height="85" rx="10" fill="#151b23" stroke="#79b5dd" stroke-opacity=".6" stroke-width="2"/><text x="60" y="340" fill="#f0f3f6" font-size="22" >Frozen linear readout</text><text x="60" y="367" fill="#aebbc9" font-size="16" >Preallocated control-owned coefficients</text><rect x="40" y="418" width="460" height="85" rx="10" fill="#151b23" stroke="#79b5dd" stroke-opacity=".6" stroke-width="2"/><text x="60" y="452" fill="#f0f3f6" font-size="22" >50-Hz nominal output</text><text x="60" y="479" fill="#aebbc9" font-size="16" >Timestamped commands; neutral fallback</text><path d="M270 167V194" fill="none" stroke="#79b5dd" stroke-width="2" marker-end="url(#arrow)" /><path d="M270 279V306" fill="none" stroke="#79b5dd" stroke-width="2" marker-end="url(#arrow)" /><path d="M270 391V418" fill="none" stroke="#79b5dd" stroke-width="2" marker-end="url(#arrow)" /><rect x="620" y="138" width="460" height="85" rx="10" fill="#151b23" stroke="#e3b879" stroke-opacity=".6" stroke-width="2"/><text x="640" y="172" fill="#f0f3f6" font-size="22" >Completed-trial buffer</text><text x="640" y="199" fill="#aebbc9" font-size="16" >Bounded IPC; explicit admission accounting</text><rect x="620" y="274" width="460" height="85" rx="10" fill="#151b23" stroke="#e3b879" stroke-opacity=".6" stroke-width="2"/><text x="640" y="308" fill="#f0f3f6" font-size="22" >HMM + residual ridge</text><text x="640" y="335" fill="#aebbc9" font-size="16" >Completed-trial pseudo-supervision</text><rect x="620" y="410" width="460" height="85" rx="10" fill="#151b23" stroke="#e3b879" stroke-opacity=".6" stroke-width="2"/><text x="640" y="444" fill="#f0f3f6" font-size="22" >Coherent model snapshot</text><text x="640" y="471" fill="#aebbc9" font-size="16" >Guarded install; immutable proposal</text><path d="M850 223V274" fill="none" stroke="#e3b879" stroke-width="2" marker-end="url(#arrow)" /><path d="M850 359V410" fill="none" stroke="#e3b879" stroke-width="2" marker-end="url(#arrow)" /><path d="M500 124H562V180H620" fill="none" stroke="#79b5dd" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/><path d="M620 450H556V348H500" fill="none" stroke="#e3b879" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/><text x="544" y="266" fill="#aebbc9" font-size="15" text-anchor="middle">IPC</text><rect x="40" y="550" width="1040" height="65" rx="9" fill="#151b23" stroke="#2a3441"/><text x="560" y="578" fill="#f0f3f6" font-size="19" text-anchor="middle">Version + epoch + feature identity + training-end checks</text><text x="560" y="602" fill="#aebbc9" font-size="16" text-anchor="middle">Deadline monitoring · stale-update rejection · rollback</text></g></svg>
